[package]
authors = ["Mike Graham <michael@forested.earth>"]
edition = "2021"
name    = "node-ark-vrf"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
ark-ec        = { version = "0.5", default-features = false }
ark-ff        = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-std       = { version = "0.5", default-features = false }
ark-vrf       = { version = "0.1.0", features = ["bandersnatch", "std"] }
hex           = "0.4"
napi          = { version = "2", features = ["napi8"] }
napi-derive   = "2"
sha2          = { version = "0.10", default-features = false }

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3
panic         = "abort"
